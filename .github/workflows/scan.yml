name: ETF scan

on:
  schedule:
      - cron: '0,15 4-9 * * 1-5'
      - cron: '0 10 * * 1-5'
  workflow_dispatch:            # lets the dashboard's "Check now" button (or you,
                                 # manually, from the Actions tab) trigger a scan
                                 # on demand instead of waiting for the next slot
    inputs:
      test_alert:
        description: 'Send ONE fake test alert (Telegram + dashboard) for this reason, then scan normally. Leave as none for a normal run.'
        type: choice
        default: none
        options:
          - none
          - take_profit
          - stop_loss
          - mean_reversion
          - ema_death_cross
          - max_holding_period

permissions:
  contents: write   # needed so the workflow can commit portfolio.json / state.json back

concurrency:
  group: etf-scan
  cancel-in-progress: false   # never kill a scan mid-write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ github.event.inputs.test_alert }}
        run: python scan.py

      - name: Commit updated data
        run: |
          git config user.name "etf-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add portfolio.json docs/state.json
          git diff --staged --quiet || git commit -m "scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
