name: ETF scan

on:
  schedule:
    # Every 15 minutes, 9:15 AM - 3:30 PM IST, Mon-Fri. GitHub cron is UTC (IST = UTC+5:30):
    - cron: '45 3 * * 1-5'            # 09:15 IST
    - cron: '0,15,30,45 4-9 * * 1-5'  # 09:30 ... 15:15 IST
    - cron: '0 10 * * 1-5'            # 15:30 IST
    # NSE holidays are skipped inside scan.py (see nse_holidays.json).
  workflow_dispatch:            # lets the dashboard's "Check now" button (or you,
                                 # manually, from the Actions tab) trigger a scan
                                 # on demand instead of waiting for the next slot
    inputs:
      test_alert:
        description: 'Send ONE fake test alert (Telegram + dashboard) for this reason, then scan normally. Leave as none for a normal run.'
        type: choice
        default: none
        options:
          - none
          - take_profit
          - stop_loss
          - trail_stop
          - breakeven_stop
          - trail_rank_lost
          - mean_reversion
          - ema_death_cross
          - max_holding_period
          - late_hold_ema_exit

permissions:
  contents: write   # needed so the workflow can commit portfolio.json / state.json back

concurrency:
  group: etf-scan
  cancel-in-progress: false   # never kill a scan mid-write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan and commit
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ github.event.inputs.test_alert }}
        run: |
          git config user.name "etf-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          # Scans now run every 15 min, so the dashboard may have committed portfolio.json
          # in the meantime. If the push is rejected: re-sync with the repo and scan again.
          for attempt in 1 2 3; do
            python scan.py
            git add portfolio.json docs/state.json
            git diff --staged --quiet || git commit -m "scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) - re-syncing and re-scanning"
            git fetch origin main
            git reset --hard origin/main
            export TEST_ALERT=none
          done
          exit 1
